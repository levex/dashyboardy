# fly.toml app configuration file generated for personal dashboard
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'personal-dashboard'
primary_region = 'fra'

[build]

[env]
  PHX_SERVER = 'true'
  PORT = '8080'
  DATABASE_PATH = '/data/dashboard.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[mounts]]
  source = 'dashboard_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
